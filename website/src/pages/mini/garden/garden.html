<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gro a garden</title>
    <link href="../font.css" rel="stylesheet">
    <script type="module" src="../mini/garden/garden.js"></script>
  </head>
  <style>
    html, body {
      overflow: hidden;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: "Jersey 20", sans-serif;
      background-color: #000000;
    }

    body canvas {
      image-rendering: optimizeSpeed;
      image-rendering: crisp-edges;
      image-rendering: -moz-crisp-edges;
      image-rendering: -o-crisp-edges;
      image-rendering: -webkit-optimize-contrast;
      -ms-interpolation-mode: nearest-neighbor;
    }

    div {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      width: 100vw;
      height: 100vh;
    }


    #loading h1 {
      font-size: 10vw;
      color: white;
      margin-bottom: 2vw;
    }

    #loading p {
      margin-top: 1vw;
      font-size: 3vw;
      font-weight: 300;
      color: grey;
    }
  </style>
  <body>
    <div id="loading"><h1 id="loading-text">loading</h1></div>
    <canvas style="display: none" id="canvas"></canvas>
  </body>
</html>

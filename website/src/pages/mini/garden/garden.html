<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>garden simulator</title>
    <link href="../font.css" rel="stylesheet">
    <script type="module" src="../mini/garden/garden.js"></script>

    html, body {
      overflow: hidden;
      margin: 0;

<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin</title>
    <link rel="stylesheet" href="admin.css">
    <link href="font.css" rel="stylesheet">
    <script src="admin.js" type="module"></script>
  </head>
  <body>
    <div class="main-container" id="main" style="display: none;">
        <p style="font-size: 3vw; text-decoration: underline; cursor: pointer;" id="main-text">admin panel</p>
        <p>username to id <input class="input" id="ui" placeholder="username"  style="width: 10vw; margin-top: 1vw; margin-left: 0vw; margin-top: 2vw;"></input> <button class="input" id="submit_ui">submit</button></p>
        <p>delete account <input class="input" id="da" placeholder="username"  style="width: 10vw; margin-top: 1vw; margin-left: 0vw; margin-top: 2vw;"></input> <button class="input" id="submit_da">submit</button></p>
        <p style="margin-bottom: 0vw;">change news</p>
        <textarea style="width: 25vw; height: 15vw;" id="cn" class="input"></textarea> <button class="input" id="submit_cn">submit</button>
        <p>change password <input class="input" id="cpa1" placeholder="username"  style="width: 10vw; margin-top: 1vw; margin-left: 0vw; margin-top: 2vw;"></input> <input class="input" id="cpa2" placeholder="password"  style="width: 10vw; margin-top: 1vw; margin-left: 0vw; margin-top: 2vw;"></input> <button class="input" id="submit_cpa">submit</button></p>
        <p>fetch password <input class="input" id="fp" placeholder="username"  style="width: 10vw; margin-top: 1vw; margin-left: 0vw; margin-top: 2vw;"></input> <button class="input" id="submit_fp">submit</button></p>
        <p>set points <input class="input" id="sp1" placeholder="username"  style="width: 10vw; margin-top: 1vw; margin-left: 0vw; margin-top: 2vw;"></input> <input class="input" id="sp2" placeholder="amount"  style="width: 10vw; margin-top: 1vw; margin-left: 0vw; margin-top: 2vw;"></input> <button class="input" id="submit_sp">submit</button></p>
        <p>make admin <input class="input" id="ma" placeholder="username"  style="width: 10vw; margin-top: 1vw; margin-left: 0vw; margin-top: 2vw;"></input> <button class="input" id="submit_ma">submit</button></p>
        <p>revoke admin <input class="input" id="ra" placeholder="username"  style="width: 10vw; margin-top: 1vw; margin-left: 0vw; margin-top: 2vw;"></input> <button class="input" id="submit_ra">submit</button></p>
        <p id="db_bk" style="margin-bottom: 0vw;">last database backup: xxx, database size: xxx</p>
        <button class="input" id="get_db">view database</button> <button class="input" id="restore_db">resore database from backup</button>
    </div>

    <div id="disabling" style="position: absolute; top: 5vw; left: 35vw;">
      <p style="font-size: 3vw; text-decoration: underline;">features</p>
      <input type="checkbox" class="input" id="disable_files"> files
      <input type="checkbox" class="input" id="disable_chat"> chat
      <input type="checkbox" class="input" id="disable_mmo"> mmo
      <br>
      <input type="checkbox" class="input" id="disable_gambling"> gambling
      <input type="checkbox" class="input" id="disable_game"> game
      <input type="checkbox" class="input" id="disable_music"> music
    </div>
    <div id="feedback" style="display: none; position: absolute; top: 5vw; right: 20vw; text-wrap: wrap;"></div>
  </body>
</html>

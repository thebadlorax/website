<!DOCTYPE html>
<!----music is wild----------:}-->
<!----you can like--------------->
<!----hear things---------------->
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>music</title>
    <link rel="stylesheet" href="music.css">
    <link href="font.css" rel="stylesheet">
    <link rel="icon" href="../res/favicon.ico" type="image/x-icon">
    <script type="module" src="./music.js"></script>
  </head>
  <body>
    <div style="position: absolute; top: .5%; height: 98.5%; width: 98.5%;">
        <div id="playlist_div" class="menu-div" style="position: absolute; left: 0%; top: 20%; width: 20%; height: 80%; display: flex; flex-direction: column; justify-content: start;">
            <button class="playlist-button" id="create_playlist_button">+</button>
        </div>
        <div class="menu-div" style="position: absolute; left: 20%; top: 20%; width: 80%; height: 80%; border: 1px darkgrey solid;">
            <div id="main_view_none" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; display: none;">
                <p>no data to show :(</p>
            </div>
            <div id="main_view_playlist" style="width: 100%; height: 100%; display: flex; align-items: start; justify-content: flex-start; display: none; flex-direction: column;">
            </div>
            <div id="main_view_playlist_choice" style="width: 100%; height: 100%; display: flex; align-items: start; justify-content: center; display: none;">
            </div>
            <div id="main_view_song" style="width: 100%; height: 100%; display: flex; align-items: flex-start; justify-content: center; display: none; flex-direction: row;">
                <div id="main_view_song_info" style="width: 70%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column;"></div>
                <div id="main_view_song_actions" style="width: 30%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; border-left: 1px darkgrey solid;">
                    <button id="add_to_playlist" class="song-action-button">add to playlist</button>
                    <button id="song_play" class="song-action-button">play</button>
                    <button id="song_download" class="song-action-button">download</button>
                </div>
            </div>
        </div>
        <div class="menu-div" style="position: absolute; left: 35%; top: 0%; width: 65%; height: 20%; flex-direction: row;;">
            <p style="position: absolute; top: -10%; left: 40%;">currently playing: </p>
            <p id="global_title" style="position: absolute; top: 8%; left: 43%;" >nothing!</p>
            <input id="song_search" placeholder="song url (yt)" style="width: 70%; height: 20%;">
            <div style="margin-left: 2.5%;">
                <!--⇄ ◀ 𓊕 ▐▶ ↻-->
                <button id="global_play">▶︎</button>
            </div>
            
        </div>
    </div>
    
    <a id="banner" style="position: absolute; top: 0vw; left: -5vw;" href="/"><img src="../res/music_banner.png" style="width: 40vw; height: 13vw; transform: scale(0.7)"></a>
    
    <div id="context" class="context-menu">
        <ul>
            <li><a class="unselectable" id="delete">Delete</a></li>
            <li><a class="unselectable" id="rename">Rename</a></li>
            <li><a class="unselectable" id="download">Download</a></li>
            <li class="separator"></li>
            <li><a id="close" class="clickable" >Close</a></li>
        </ul>
    </div>
</body>
</html>
